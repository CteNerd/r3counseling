name: Frontend Promotion Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false --passWithNoTests

  deploy_staging:
    runs-on: ubuntu-latest
    needs: build_and_test
    environment: staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (staging)
        run: CI=false npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL_STAGING }}
          REACT_APP_PUBLIC_URL: ${{ secrets.REACT_APP_PUBLIC_URL_STAGING }}

      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STAGING_ROLE_ARN }}
          role-session-name: r3counseling-frontend-deploy-staging
          aws-region: us-east-1

      - name: Deploy frontend to S3 (staging)
        run: aws s3 sync build/ "s3://${{ secrets.FRONTEND_STAGING_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache (staging)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.FRONTEND_STAGING_CLOUDFRONT_DISTRIBUTION_ID }}
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

  deploy_production:
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (production)
        run: CI=false npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_PUBLIC_URL: ${{ secrets.REACT_APP_PUBLIC_URL }}

      - name: Configure AWS credentials (production)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: r3counseling-frontend-deploy-prod
          aws-region: us-east-1

      - name: Deploy frontend to S3 (production)
        run: aws s3 sync build/ "s3://${{ secrets.FRONTEND_PROD_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache (production)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.FRONTEND_PROD_CLOUDFRONT_DISTRIBUTION_ID }}
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
